<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Sistema POS para Restaurante Sabor a la Carta">
    <title>Sabor a la Carta - Sistema POS</title>

    <!-- Bootstrap 5 (con fallback local) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos principales -->
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/hero.css">
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="./css/productos.css">
    <link rel="stylesheet" href="./css/carrito.css">
    <link rel="stylesheet" href="./css/notifications.css">
    <link rel="stylesheet" href="./css/responsive.css">

    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        main {
            flex: 1;
        }
        
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 400px;
            font-size: 1.2rem;
            color: var(--color-gris);
        }
    </style>
</head>
<body>
    <!-- Header se renderiza con JS -->
    <!-- Main se renderiza con JS -->
    
    <div class="loading">Cargando aplicación...</div>

    <!-- Scripts -->
    <script src="./js/utils.js"></script>
    <script src="./js/productos-v2.js"></script>
    <script src="./js/carrito-v2.js"></script>
    <script src="./js/pedidos-v2.js"></script>
    <script src="./js/mesas-v2.js"></script>
    <script src="./js/main-v2.js"></script>

    <script>
        // Habilitar debugging en desarrollo
        window.DEBUG_MODE = true;
        
        // Ejecutar la aplicación cuando todos los scripts hayan cargado
        window.addEventListener('load', () => {
            if (typeof inicializarApp === 'function') {
                inicializarApp();
            }
        });
    </script>
</body>
</html>
